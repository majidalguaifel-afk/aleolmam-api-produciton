# ============================================================================
# إعداد Nginx لـ api.alelmam.com
# ضع هذا الملف في: /etc/nginx/sites-available/api.alelmam.com
# ثم فعّله بالأمر: ln -s /etc/nginx/sites-available/api.alelmam.com /etc/nginx/sites-enabled/
# ============================================================================

server {
    listen 80;
    server_name api.alelmam.com;

    # يُستخدم مؤقتاً من certbot للتحقق من ملكية الدومين قبل إصدار شهادة SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # بعد تفعيل SSL عبر certbot، سيُضاف تلقائياً تحويل كل الطلبات لـ https هنا
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.alelmam.com;

    # هذه المسارات تُضاف تلقائياً بواسطة certbot بعد تشغيله — لا تعدّلها يدوياً
    # ssl_certificate /etc/letsencrypt/live/api.alelmam.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.alelmam.com/privkey.pem;

    client_max_body_size 5M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
